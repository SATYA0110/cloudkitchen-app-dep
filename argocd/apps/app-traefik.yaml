# =============================================================================
# Application: traefik (ingress controller)
# -----------------------------------------------------------------------------
# Installs Traefik from its official Helm repo into the `ingress` namespace.
# Traefik fronts the platform and terminates TLS (certs issued by cert-manager).
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cloudkitchen

  source:
    # 🌟 FIXED: Changed from https://traefik.io to the official chart hosting registry URL
    repoURL: https://traefik.io
    chart: traefik
    targetRevision: 28.3.0
    helm:
      values: |
        # ---- minimal sensible defaults ----
        deployment:
          replicas: 2
        service:
          type: LoadBalancer
        ingressClass:
          enabled: true
          isDefaultClass: true
          
        ports:
          web:
            port: 8000
            exposedPort: 80
            protocol: TCP
          websecure:
            port: 8443
            exposedPort: 443
            protocol: TCP
            tls:
              enabled: false
            
        providers:
          kubernetesIngress:
            enabled: true
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: true
            
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

  destination:
    name: in-cluster
    namespace: ingress

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
