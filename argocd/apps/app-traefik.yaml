# =============================================================================
# Application: traefik (ingress controller)
# -----------------------------------------------------------------------------
# Installs Traefik from its official Helm repo into the `ingress` namespace.
# Traefik fronts the platform and terminates TLS (certs issued by cert-manager).
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cloudkitchen

  source:
    # 🌟 CORRECTED: Points to the authentic Helm chart registry server endpoint
    repoURL: https://traefik.io
    chart: traefik
    targetRevision: 28.3.0
    helm:
      values: |
        # ---- minimal sensible defaults ----
        deployment:
          replicas: 2
        service:
          type: LoadBalancer
        ingressClass:
          enabled: true
          isDefaultClass: true

        # 🌟 PORTS SECTION REMOVED COMPLETELY
        # This prevents Helm marshaling context errors and lets Traefik default cleanly to plain HTTP.

        # 🌟 CROSS-NAMESPACE DISCOVERY: Instructs Traefik to look across boundaries into cloudkitchen
        providers:
          kubernetesIngress:
            enabled: true
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: true

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

  destination:
    server: https://default.svc
    namespace: ingress

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

