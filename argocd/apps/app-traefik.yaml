# =============================================================================
# Application: traefik (ingress controller)
# -----------------------------------------------------------------------------
# Installs Traefik from its official Helm repo into the `ingress` namespace.
# Traefik fronts the platform and terminates TLS (certs issued by cert-manager).
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cloudkitchen

  source:
    repoURL: https://traefik.io
    chart: traefik
    targetRevision: 28.3.0
    helm:
      values: |
        deployment:
          replicas: 2
        service:
          type: LoadBalancer
        ingressClass:
          enabled: true
          isDefaultClass: true

        ports:
          websecure:
            tls:
              enabled: false

        providers:
          kubernetesIngress:
            enabled: true
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: true

  destination:
    # 🌟 BOTH target properties explicitly mapped to fulfill spec validation rules
    server: https://default.svc
    namespace: ingress

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

