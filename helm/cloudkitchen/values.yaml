postgres:
  name: postgres
  servicename: postgres
  image: 'postgres:15-alpine'
  port: 5432
  storage: 10Gi
  storageClass: standard-rwo
redis:
  name: redis
  servicename: redis
  image: 'redis:7-alpine'
  port: 6379
nats:
  name: nats
  servicename: nats
  image: 'nats:2.10-alpine'
  clientPort: 4222
  monitorPort: 8222
  storage: 5Gi
  storageClass: standard-rwo
db:
  host: postgres
  port: '5432'
  name: cloudkitchen
  sslmode: disable
ingress:
  enabled: true
  tls: false
  host: vijaygiduthuri.in
  lbIP: 34.10.232.43
  entryPoint: web
  tlsSecretName: cloudkitchen-tls
  clusterIssuer: letsencrypt-prod
secrets:
  dbUser: cloudkitchen
  dbPassword: cloudkitchen-dev-password
  jwtSecret: changeme-use-a-strong-secret-in-production
  jwtExpiry: 24h
  redisPassword: ''
